name: TradeYar offline specialist depot policy
on:
  push:
  pull_request:
jobs:
  verify-offline-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact image lock and offline-only scripts
        run: python -m unittest discover -s tests -p 'test_offline_image_manifest.py' -v
