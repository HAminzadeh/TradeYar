services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tradeyar
      POSTGRES_USER: tradeyar
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tradeyar-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  tradeyar-data: